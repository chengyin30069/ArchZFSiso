name: Monthly Arch ZFS ISO Build and Release

on:
  workflow_dispatch:

  schedule:
    # 每月 1 號台灣時間 00:00 執行
    - cron: "0 0 1 * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-archzfsiso-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p "${{ github.workspace }}/iso"
          mkdir -p "${{ github.workspace }}/logs"
          mkdir -p "${{ github.workspace }}/metadata"

      - name: Generate release metadata
        id: meta
        shell: bash
        run: |
          RELEASE_DATE="$(date +'%Y-%m-%d')"
          RELEASE_TIMESTAMP="$(date +'%Y-%m-%d-%H%M')"

          TAG_NAME="monthly-${RELEASE_TIMESTAMP}"
          RELEASE_NAME="Arch ZFS ISO ${RELEASE_TIMESTAMP}"

          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
          echo "release_timestamp=${RELEASE_TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          set -o pipefail

          docker buildx build -t archzfsiso . \
            2>&1 | tee "${{ github.workspace }}/logs/docker-build.log"

      - name: Build ISO and collect package versions
        shell: bash
        run: |
          set -o pipefail

          docker run \
            --privileged \
            --rm \
            -v "${{ github.workspace }}/iso:/ISOBUILD/zfsiso/ISOOUT" \
            -v "${{ github.workspace }}/metadata:/metadata" \
            archzfsiso \
            bash -lc '
              set -euo pipefail

              sudo mkarchiso -v -w zfsiso/WORK -o zfsiso/ISOOUT zfsiso/

              AIROOTFS="/ISOBUILD/zfsiso/WORK/x86_64/airootfs"

              if [ ! -d "${AIROOTFS}" ]; then
                echo "Cannot find airootfs at ${AIROOTFS}" >&2
                echo "Existing WORK directories:" >&2
                find /ISOBUILD/zfsiso/WORK -maxdepth 5 -type d | sort >&2 || true
                exit 1
              fi

              {
                echo "## Package versions"
                echo ""
                echo "| Package | Version |"
                echo "|---|---|"

                for pkg in linux linux-headers linux-lts linux-lts-headers archiso zfs-utils zfs-dkms pacman; do
                  version="$(pacman --root "${AIROOTFS}" -Q "${pkg}" 2>/dev/null | awk "{print \$2}" || true)"

                  if [ -z "${version}" ]; then
                    version="not installed / not found"
                  fi

                  echo "| ${pkg} | ${version} |"
                done
              } | tee /metadata/package-versions.md

              MODULE_DIRS="$(find "${AIROOTFS}/usr/lib/modules" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort || true)"

              if [ -z "${MODULE_DIRS}" ]; then
                echo "No kernel module directory found under ${AIROOTFS}/usr/lib/modules" >&2
                exit 1
              fi

              echo "${MODULE_DIRS}" | sed "s#${AIROOTFS}/usr/lib/modules/##" | tee /metadata/kernel-versions.txt

              echo "Detected kernel module directories:"
              cat /metadata/kernel-versions.txt

              if ! pacman --root "${AIROOTFS}" -Q linux-lts >/dev/null 2>&1; then
                echo "linux-lts is not installed in airootfs" >&2
                exit 1
              fi

              if ! pacman --root "${AIROOTFS}" -Q linux-lts-headers >/dev/null 2>&1; then
                echo "linux-lts-headers is not installed in airootfs" >&2
                exit 1
              fi

              if pacman --root "${AIROOTFS}" -Q linux >/dev/null 2>&1; then
                echo "Unexpected package linux is still installed in airootfs" >&2
                exit 1
              fi

              if pacman --root "${AIROOTFS}" -Q linux-headers >/dev/null 2>&1; then
                echo "Unexpected package linux-headers is still installed in airootfs" >&2
                exit 1
              fi

              if ! pacman --root "${AIROOTFS}" -Q zfs-dkms >/dev/null 2>&1; then
                echo "zfs-dkms is not installed in airootfs" >&2
                exit 1
              fi

              if ! pacman --root "${AIROOTFS}" -Q zfs-utils >/dev/null 2>&1; then
                echo "zfs-utils is not installed in airootfs" >&2
                exit 1
              fi

              ZFS_MODULE_COUNT=0

              while IFS= read -r module_dir; do
                kernel_version="$(basename "${module_dir}")"

                count="$(find "${module_dir}" -type f \
                  \( \
                    -name "zfs.ko" \
                    -o -name "zfs.ko.zst" \
                    -o -name "zfs.ko.xz" \
                    -o -name "zfs.ko.gz" \
                  \) | wc -l)"

                echo "ZFS module count for ${kernel_version}: ${count}"

                ZFS_MODULE_COUNT="$((ZFS_MODULE_COUNT + count))"
              done <<< "${MODULE_DIRS}"

              if [ "${ZFS_MODULE_COUNT}" -eq 0 ]; then
                echo "ZFS kernel module was not found in airootfs" >&2
                echo "Kernel module tree:" >&2
                find "${AIROOTFS}/usr/lib/modules" -maxdepth 6 -type f | sort >&2 || true
                exit 1
              fi

              echo "ZFS kernel module found in airootfs."
            ' 2>&1 | tee "${{ github.workspace }}/logs/iso-build.log"

      - name: Fail on DKMS build warning
        if: always()
        shell: bash
        run: |
          LOG_FILE="${{ github.workspace }}/logs/iso-build.log"

          if [ ! -f "${LOG_FILE}" ]; then
            echo "iso-build.log does not exist"
            exit 1
          fi

          if grep -E "dkms install .* exited 1|WARNING: .*dkms install|Error! Bad return status for module build|bad exit status|DKMS make.log" "${LOG_FILE}"; then
            echo "Detected DKMS failure in iso-build.log"
            exit 1
          fi

      - name: Verify ISO exists
        shell: bash
        run: |
          shopt -s nullglob
          ISO_FILES=("${{ github.workspace }}"/iso/*.iso)

          if [ "${#ISO_FILES[@]}" -eq 0 ]; then
            echo "No ISO file found in ${{ github.workspace }}/iso"
            echo "Directory content:"
            find "${{ github.workspace }}/iso" -maxdepth 2 -type f -print -exec ls -lh {} \;
            exit 1
          fi

          echo "Generated ISO files:"
          find "${{ github.workspace }}/iso" -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd "${{ github.workspace }}/iso"

          sha256sum *.iso | tee "SHA256SUMS"

          for iso in *.iso; do
            sha256sum "${iso}" > "${iso}.sha256"
          done

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "Automated monthly Arch ZFS ISO build."
            echo ""
            echo "## Build info"
            echo ""
            echo "- Build date: ${{ steps.meta.outputs.release_date }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""

            if [ -f "${{ github.workspace }}/metadata/package-versions.md" ]; then
              cat "${{ github.workspace }}/metadata/package-versions.md"
            else
              echo "## Package versions"
              echo ""
              echo "Package version metadata was not generated."
            fi

            echo ""

            if [ -f "${{ github.workspace }}/metadata/kernel-versions.txt" ]; then
              echo "## Kernel module directories"
              echo ""
              echo '```text'
              cat "${{ github.workspace }}/metadata/kernel-versions.txt"
              echo '```'
              echo ""
            fi

            echo "## SHA256"
            echo ""
            echo '```text'
            cat "${{ github.workspace }}/iso/SHA256SUMS"
            echo '```'
            echo ""
            echo "## Notes"
            echo ""
            echo "This ISO was generated automatically by GitHub Actions."
            echo ""
            echo "The workflow explicitly checks that:"
            echo ""
            echo "- linux-lts is installed"
            echo "- linux-lts-headers is installed"
            echo "- linux is not installed"
            echo "- linux-headers is not installed"
            echo "- zfs-dkms is installed"
            echo "- zfs-utils is installed"
            echo "- at least one zfs.ko kernel module exists in the generated airootfs"
            echo "- DKMS failure warnings are not present in iso-build.log"
          } | tee "${{ github.workspace }}/metadata/release-notes.md"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archzfsiso-build-artifacts-${{ steps.meta.outputs.release_timestamp }}
          path: |
            ${{ github.workspace }}/logs/
            ${{ github.workspace }}/metadata/
            ${{ github.workspace }}/iso/*.iso
            ${{ github.workspace }}/iso/*.sha256
            ${{ github.workspace }}/iso/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release and upload ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob

          RELEASE_FILES=(
            "${{ github.workspace }}"/iso/*.iso
            "${{ github.workspace }}"/iso/*.sha256
            "${{ github.workspace }}"/iso/SHA256SUMS
          )

          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          gh release create "${{ steps.meta.outputs.tag_name }}" \
            "${RELEASE_FILES[@]}" \
            --title "${{ steps.meta.outputs.release_name }}" \
            --notes-file "${{ github.workspace }}/metadata/release-notes.md"

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ISSUE_TITLE="Monthly Arch ZFS ISO build failed - ${{ steps.meta.outputs.release_date }}"

          ISSUE_BODY="$(cat <<EOF
          The automated monthly Arch ZFS ISO build failed.

          ## Run info

          - Workflow: \`${{ github.workflow }}\`
          - Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}

          ## What to check

          1. Open the failed workflow run.
          2. Download the uploaded artifact if it exists.
          3. Check these logs:
             - \`docker-build.log\`
             - \`iso-build.log\`
          4. Common causes:
             - Arch package mirror temporarily broken
             - OpenZFS does not support the current kernel
             - linux-lts / linux-lts-headers not installed into airootfs
             - DKMS module build failed
             - zfs.ko was not generated
             - AUR package build failure
             - ISO output path changed
             - GitHub runner timeout

          ## Expected ISO kernel policy

          This workflow expects the generated ISO to use:

          - \`linux-lts\`
          - \`linux-lts-headers\`
          - \`zfs-dkms\`
          - \`zfs-utils\`

          It also expects the normal \`linux\` and \`linux-headers\` packages to be absent.

          The build artifacts are uploaded with 30-day retention if the upload step was reached.
          EOF
          )"

          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body "${ISSUE_BODY}"
