name: Monthly Arch ZFS ISO Build and Release

on:
  workflow_dispatch:

  schedule:
    # 每月 1 號台灣時間 00:00 執行
    - cron: "0 0 1 * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: monthly-archzfsiso-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          mkdir -p "${{ github.workspace }}/iso"

      - name: Build Docker image
        run: |
          docker buildx build -t archzfsiso .

      - name: Build ISO inside Docker
        run: |
          docker run \
            --privileged \
            --rm \
            -v "${{ github.workspace }}/iso:/ISOBUILD/zfsiso/ISOOUT" \
            archzfsiso

      - name: List generated files
        run: |
          find "${{ github.workspace }}/iso" -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Generate release metadata
        id: meta
        run: |
          RELEASE_DATE="$(date +'%Y-%m-%d')"
          TAG_NAME="monthly-${RELEASE_DATE}"
          RELEASE_NAME="Arch ZFS ISO ${RELEASE_DATE}"

          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ISO_FILES=("${{ github.workspace }}"/iso/*.iso)

          if [ "${#ISO_FILES[@]}" -eq 0 ]; then
            echo "No ISO file found in ${{ github.workspace }}/iso"
            exit 1
          fi

          gh release create "${{ steps.meta.outputs.tag_name }}" \
            "${ISO_FILES[@]}" \
            --title "${{ steps.meta.outputs.release_name }}" \
            --notes "Automated monthly Arch ZFS ISO build.

          Built from commit: ${{ github.sha }}

          This release was generated by GitHub Actions."
